name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . "xonsh[ptk]" pytest

      - name: Verify xontrib_tmux.pth installed
        run: |
          python -c "import pathlib, site; pths = [pathlib.Path(d) / 'xontrib_tmux.pth' for d in site.getsitepackages()]; assert any(p.exists() for p in pths), pths"

      - name: Run pytest
        run: python -m pytest -v

  ci-gate:
    name: All tests passed
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Check test matrix results
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Test matrix result: ${{ needs.test.result }}"
            exit 1
          fi
