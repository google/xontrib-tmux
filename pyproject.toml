[project]
name = "xontrib-tmux"
version = "0.0.1"
license = {file = "LICENSE"}
description = "xonsh xontrib adding library support for running commands in tmux sessions/panes/windows"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: System :: Shells",
    "Topic :: System :: System Shells",
    "Topic :: Terminals",
]
requires-python = ">=3.11"
dependencies = [
    "libtmux>=0.62.0",
    "dill",
    "xonsh>=0.12.5",
]
authors = [
    { name = "xontrib-tmux authors" },
]
maintainers = [
    { name = "Riley Wood" },
]
[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.entry-points."xonsh.xontribs"]
"tmux" = "xontrib_tmux"

[project.urls]
Homepage = "https://github.com/google/xontrib-tmux"
Documentation = "https://github.com/google/xontrib-tmux/blob/main/README.md"
Code = "https://github.com/google/xontrib-tmux"
"Issue tracker" = "https://github.com/google/xontrib-tmux/issues"

[dependency-groups]
dev = ["pytest>=7.0"]

[tool.uv]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xontrib_tmux"]

[tool.black]
include = '\.pyi?$'
force-exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.pytest_cache
  | \.tox
  | \.vscode
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | disk-cache.sqlite3
)/
'''

[tool.ruff]
lint.select = [
    "E",
    "F",
    "B", # flake8-bugbear
    "I", # isort
    "UP", # pyupgrade
    "SIM", # simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff specific rules
]
